# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run `cargo deny --manifest-path src-tauri/Cargo.toml check` before opening a
# pull request.

[advisories]
version = 2
ignore = [
    # zip 4 via tauri-plugin-updater: extraction only runs on archives whose
    # Ed25519 signature verified against our own release key.
    # See persea-grove/persea-desktop#142.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # Unmaintained, no safe upgrade: brought in transitively by tauri.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # Build-time only, pulled in by the GTK stack.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
