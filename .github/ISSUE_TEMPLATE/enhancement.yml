name: Enhancement
description: Suggest a feature or improvement for Persea Desktop
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem you are trying to solve and the outcome you expect.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stands in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Existing behavior from similar tools counts as prior art.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - instances (servers, settings)
        - sessions (tabs, windows, pop-out)
        - tray and notifications
        - transfers (drag-drop, downloads)
        - keychain and pairing
        - kiosk and hotkeys
        - provisioning
        - installers and updates
        - documentation
        - other
    validations:
      required: true

  - type: checkboxes
    id: workaround
    attributes:
      label: Workaround
      options:
        - label: A workaround exists today
        - label: No workaround, the feature is blocked without it
