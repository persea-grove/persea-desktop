name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # Weekly, Sunday 09:07 UTC (off the top of the hour to avoid the
    # scheduled-run thundering herd).
    - cron: '7 9 * * 0'

permissions:
  contents: read
  security-events: write

# Group on ref; cancel superseded runs on PRs and other non-main refs.
# When called as a reusable workflow the caller's concurrency applies.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (rust + javascript-typescript, security-extended)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux system dependencies (build prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: rust,javascript-typescript
          queries: security-extended
      - name: Build (manual CodeQL build step)
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
