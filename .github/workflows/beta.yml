name: Beta Desktop

# Rolling beta, mirroring the server repo's beta.yml: manual dispatch
# with the branch picker builds the FULL artifact matrix (same legs as
# Release) and publishes it to the `beta` pre-release. Each run deletes
# the previous beta release and tag, recreates them at the dispatched
# branch head as a draft, uploads fresh assets, then un-drafts. Checks
# (ci.yml gates + CodeQL) gate the build: a failing check aborts before
# anything is published. Dispatch-only for parity with the server beta;
# no `beta` branch trigger.
on:
  workflow_dispatch:

permissions:
  contents: write
  # codeql.yml runs as a reusable workflow and needs security-events to
  # upload its analysis. A called workflow cannot elevate permissions the
  # caller did not grant, so the caller has to hold them (persea-desktop#124).
  security-events: write

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  checks:
    name: Gates (check / fmt / clippy / test / audit)
    uses: ./.github/workflows/ci.yml

  codeql:
    name: Gates (CodeQL)
    uses: ./.github/workflows/codeql.yml

  prepare:
    name: Recreate beta pre-release
    needs: [checks, codeql]
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.beta.outputs.release_id }}
      beta_version: ${{ steps.beta.outputs.beta_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the beta pre-release
        id: beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --cleanup-tag fails when the tag ref is already gone, but the
          # release itself is removed, so the error is expected here.
          gh release delete beta --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create beta --target "$GITHUB_SHA" --draft --prerelease \
            --title "Persea Desktop beta" \
            --notes "Rolling beta build of $GITHUB_REF_NAME ($GITHUB_SHA). See docs/beta.md."
          # A draft release has no git tag yet, so the by-tag lookup returns
          # 404. Read the id from the release list instead.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq 'map(select(.tag_name == "beta"))[0].id')
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          # Beta versions are plain numbers counted up from the release
          # line, not semver pre-releases: the AppImage bundler rejects a
          # hyphen outright and the MSI bundler rejects non-numeric
          # pre-release or build metadata. Each run bumps the patch number
          # past the release, so every beta is newer than the stable build
          # it replaces and the updater offers the next one.
          #   1.1.2 base + run 4 -> 1.1.6
          BASE_PATCH=$(printf '%s' "$VERSION" | cut -d. -f3)
          BETA_PATCH=$((BASE_PATCH + GITHUB_RUN_NUMBER))
          echo "beta_version=${VERSION%.*}.$BETA_PATCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [checks, codeql, prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
            rust_targets: ""
            binary: src-tauri/target/release/persea-desktop.exe
            smoke: |
              $bin = "src-tauri\target\release\persea-desktop.exe"
              if (!(Test-Path $bin)) { Write-Error "smoke: no binary at $bin"; exit 1 }
              $p = Start-Process -FilePath $bin -PassThru
              Start-Sleep -Seconds 15
              $p.Refresh()
              if ($p.HasExited) { Write-Error "smoke: app exited early (code $($p.ExitCode))"; exit 1 }
              Write-Host "smoke: app alive after 15s"
              Stop-Process -Id $p.Id -Force
          - name: linux
            os: ubuntu-24.04
            args: --bundles deb,rpm,appimage
            rust_targets: ""
            binary: src-tauri/target/release/persea-desktop
            smoke: |
              set -euo pipefail
              BIN="src-tauri/target/release/persea-desktop"
              [ -x "$BIN" ] || { echo "smoke: no binary at $BIN" >&2; exit 1; }
              xvfb-run -a "$BIN" &
              PID=$!
              sleep 15
              if ! kill -0 "$PID" 2>/dev/null; then echo "smoke: app exited early" >&2; exit 1; fi
              echo "smoke: app alive after 15s"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
            binary: src-tauri/target/aarch64-apple-darwin/release/persea-desktop
            smoke: |
              set -euo pipefail
              BIN="src-tauri/target/aarch64-apple-darwin/release/persea-desktop"
              [ -x "$BIN" ] || { echo "smoke: no binary at $BIN" >&2; exit 1; }
              "$BIN" &
              PID=$!
              sleep 15
              if ! kill -0 "$PID" 2>/dev/null; then echo "smoke: app exited early" >&2; exit 1; fi
              echo "smoke: app alive after 15s"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
          - name: macos-x86_64
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
            binary: src-tauri/target/x86_64-apple-darwin/release/persea-desktop
            smoke: |
              set -euo pipefail
              BIN="src-tauri/target/x86_64-apple-darwin/release/persea-desktop"
              [ -x "$BIN" ] || { echo "smoke: no binary at $BIN" >&2; exit 1; }
              "$BIN" &
              PID=$!
              sleep 15
              if ! kill -0 "$PID" 2>/dev/null; then echo "smoke: app exited early" >&2; exit 1; fi
              echo "smoke: app alive after 15s"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev \
            patchelf xdg-utils libfuse2 xvfb

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          rustflags: ""
          target: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: beta-${{ matrix.name }}

      - name: Stamp the beta version
        shell: bash
        run: ./scripts/stamp-beta-version.sh "${{ needs.prepare.outputs.beta_version }}"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: the private minisign key lives ONLY in the
          # repo secrets; the public key is committed in tauri.conf.json
          # (the beta --config override below replaces the endpoints and
          # keeps the pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: beta
          releaseDraft: true
          prerelease: true
          # createUpdaterArtifacts is on in tauri.conf.json; the action
          # uploads latest.json plus every .sig to the pre-release.
          uploadUpdaterJson: true
          # The beta version is stamped into Cargo.toml, Cargo.lock and
          # tauri.conf.json by the step above, so the compiled app and the
          # published artifact report the same version and the updater
          # offers the next beta. This override only points the updater at
          # the beta release's latest.json: the stable endpoints live in
          # tauri.conf.json, so beta installers update from beta and stable
          # installers never see a beta build.
          args: >-
            ${{ matrix.args }}
            --config '{"plugins":{"updater":{"endpoints":["https://github.com/persea-grove/persea-desktop/releases/download/beta/latest.json"]}}}'

      - name: Smoke (app launches, window opens)
        run: ${{ matrix.smoke }}

  finalize:
    name: Publish beta pre-release
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Un-draft the beta pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A draft release has no git tag, so `gh release edit beta` cannot
        # find it. Publish it by id instead.
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq 'map(select(.tag_name == "beta"))[0].id')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false >/dev/null
