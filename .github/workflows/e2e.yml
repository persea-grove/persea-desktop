name: E2E

# Desktop E2E suite: builds the app, provisions a test persea server, and
# drives the real app. Linux/Windows use tauri-driver (WebKitWebDriver /
# msedgedriver); macOS embeds a WebDriver server in the debug app
# (tauri-plugin-wdio-webdriver). Manual runs also regenerate the
# canonical desktop screenshots and open a PR when the baselines drift.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'shell/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# Group on ref; cancel superseded runs on PRs and other non-main refs.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      # The workflow_dispatch screenshot run opens the baseline
      # regeneration PR; the per-PR runs here stay read-only in effect.
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev \
            xvfb openssh-server webkit2gtk-driver

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Build the app
        working-directory: src-tauri
        run: cargo build

      - name: Install tauri-driver
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAURI_DRIVER_VERSION: "2.0.6"
        run: |
          # Compile once, then reuse: the stamp records the version the
          # binary was built for, so a bump forces a rebuild while the
          # normal path skips cargo install entirely.
          mkdir -p "$HOME/.cargo/bin"
          STAMP="$HOME/.cargo/bin/.tauri-driver-$TAURI_DRIVER_VERSION"
          if [ ! -x "$HOME/.cargo/bin/tauri-driver" ] || [ ! -f "$STAMP" ]; then
            cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
            touch "$STAMP"
          fi

      - name: Provision the test persea server
        id: server
        shell: bash
        run: |
          WS="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            WS="$(cygpath -u "$GITHUB_WORKSPACE")"
          fi
          cd /tmp
          # Pinned server ref: persea main was mid review-stack on
          # 2026-08-16 and its e2e provisioning was broken (binary builds
          # but never serves /setup). PERSEA_E2E_SERVER_REF overrides;
          # unpin when the server main provisions cleanly again. A full
          # clone is fine: the server history was collapsed at v1.0.0.
          git clone --no-checkout https://github.com/persea-grove/persea.git
          git -C persea checkout "${PERSEA_E2E_SERVER_REF:-43215ab}"
          "$WS/tests/e2e/provision-server.sh" /tmp/persea 8099 | tee /tmp/provision.env
          grep -E "^PERSEA_E2E" /tmp/provision.env >> "$GITHUB_ENV"

      - name: Install the WebDriver client
        working-directory: tests/e2e
        run: npm ci

      - name: Install a version-matched Edge WebDriver (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Run the E2E specs (Linux)
        if: runner.os == 'Linux'
        working-directory: tests/e2e
        env:
          PERSEA_E2E_BASE_URL: ${{ env.PERSEA_E2E_BASE_URL }}
          PERSEA_E2E_API_KEY: ${{ env.PERSEA_E2E_API_KEY }}
          PERSEA_E2E_APPS_DIR: ../../src-tauri/target/debug
        run: xvfb-run -a node run-specs.js

      - name: Run the E2E specs (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: tests/e2e
        env:
          PERSEA_E2E_BASE_URL: ${{ env.PERSEA_E2E_BASE_URL }}
          PERSEA_E2E_API_KEY: ${{ env.PERSEA_E2E_API_KEY }}
          PERSEA_E2E_APPS_DIR: ../../src-tauri/target/debug
        run: node run-specs.js

      - name: Upload the driver and app logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            tests/e2e/tauri-driver.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture the canonical desktop screenshots (Linux)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        working-directory: tests/e2e
        env:
          PERSEA_E2E_SHOTS: ../../docs/screenshots
          PERSEA_E2E_BASE_URL: ${{ env.PERSEA_E2E_BASE_URL }}
          PERSEA_E2E_API_KEY: ${{ env.PERSEA_E2E_API_KEY }}
          PERSEA_E2E_APPS_DIR: ../../src-tauri/target/debug
        run: xvfb-run -a node run-specs.js

      - name: Capture the canonical desktop screenshots (macOS / Windows)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Linux'
        working-directory: tests/e2e
        env:
          PERSEA_E2E_SHOTS: ../../docs/screenshots
          PERSEA_E2E_BASE_URL: ${{ env.PERSEA_E2E_BASE_URL }}
          PERSEA_E2E_API_KEY: ${{ env.PERSEA_E2E_API_KEY }}
          PERSEA_E2E_APPS_DIR: ../../src-tauri/target/debug
        run: node run-specs.js

      - name: Open a regeneration PR
        # The only consumer of the job-level write grants. Scoping the
        # requested permissions to this step keeps every other step at
        # contents: read.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        permissions:
          contents: write
          pull-requests: write
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: docs/screenshots
          branch: screenshots/regen
          delete-branch: true
          commit-message: "chore(screenshots): refresh canonical desktop screenshots"
          title: "chore(screenshots): refresh canonical desktop screenshots"
          body: |
            Regenerated from the E2E suite. Review the diff; if the UI change
            was intentional, merge to update the docs.
